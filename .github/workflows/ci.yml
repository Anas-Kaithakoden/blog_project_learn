name : Blog API ci

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
  SECRET_KEY: ${{ secrets.SECRET_KEY }}

on:
  push:
    branches:
    - main
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: blog_test_db
        ports:
          - 5432:5432

    steps:
    - name: Checkout repositroy
      uses: actions/checkout@v4

    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      run:
        python -m pytest

  docker:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repositroy
      uses: actions/checkout@v4

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Get short SHA
      run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

    - name: Build docker image
      run: |
        docker build \
          -t ghcr.io/${{ github.repository }}/blog-api:latest \
          -t ghcr.io/${{ github.repository }}/blog-api:$SHORT_SHA \
          .
  
    - name: Push image
      run: |
        docker push ghcr.io/${{ github.repository }}/blog-api:latest
        docker push ghcr.io/${{ github.repository }}/blog-api:$SHORT_SHA
